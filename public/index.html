<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroTarget Solver</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0b0f19; color: #fff; padding: 20px; text-align: center; }
    .card { background: #161f30; padding: 20px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #23334d; }
    select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; font-size: 16px; border: none; }
    select { background: #222f49; color: white; }
    button { background: #0070f3; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; }
    .offset-box { font-size: 24px; font-weight: bold; color: #00ffcc; margin-top: 10px; }
    #status { color: #aaa; font-size: 14px; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>🔭 AstroTarget Solver</h2>

  <div class="card">
    <label>1. Selecciona el objetivo celeste:</label>
    <select id="targetSelect">
      <option value="83.82,-5.39">Nebulosa de Orión (M42)</option>
      <option value="10.68,41.27">Galaxia de Andrómeda (M31)</option>
      <option value="56.75,24.11">Las Pléyades (M45)</option>
      <option value="201.36,-43.01">Centaurus A</option>
    </select>
  </div>

  <div class="card">
    <label>2. Foto del cielo (1-2s exp, ISO alto):</label>
<!-- Eliminamos capture="environment" para que abra el selector de archivos / fototeca -->
<input type="file" id="cameraInput" accept="image/*" style="display:none">
<button onclick="document.getElementById('cameraInput').click()">🖼️ Seleccionar Foto del Carrete</button>
    <div id="status">Esperando foto...</div>
  </div>

  <div class="card" id="resultsCard" style="display:none">
    <h3>Instrucciones de movimiento</h3>
    <div>Elevación (Altitud):</div>
    <div class="offset-box" id="deltaAlt">0°</div>
    <br>
    <div>Giro horizontal (Azimut):</div>
    <div class="offset-box" id="deltaAz">0°</div>
  </div>

<script>
  let lat = 0, lon = 0;
  navigator.geolocation.getCurrentPosition(
    pos => { lat = pos.coords.latitude; lon = pos.coords.longitude; },
    err => alert("Activa el GPS para calcular los ángulos locales.")
  );

  document.getElementById('cameraInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const status = document.getElementById('status');
    status.innerText = "Comprimiendo imagen...";

    try {
      const base64 = await resizeImage(file, 1280);
      const [tRa, tDec] = document.getElementById('targetSelect').value.split(',').map(Number);

      status.innerText = "Subiendo al observatorio...";

      // 1. Subir imagen
      const uploadResp = await fetch('/.netlify/functions/solve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: "upload", imageBase64: base64 })
      });
      const uploadResult = await uploadResp.json();
      if (uploadResult.error) throw new Error(uploadResult.error);

      const subid = uploadResult.subid;
      status.innerText = "Resolviendo estrellas en segundo plano...";

      // 2. Comprobar periódicamente (Polling)
      let resolved = false;
      let attempts = 0;

      while (!resolved && attempts < 30) {
        await new Promise(r => setTimeout(r, 3000));
        attempts++;

        const checkResp = await fetch('/.netlify/functions/solve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "check", subid, targetRa: tRa, targetDec: tDec, lat, lon })
        });
        const result = await checkResp.json();

        if (result.status === "processing") {
          status.innerText = `${result.msg} (${attempts * 3}s)`;
        } else if (result.status === "failure") {
          throw new Error(result.error || "No se pudo calibrar la imagen.");
        } else if (result.status === "success") {
          resolved = true;
          document.getElementById('resultsCard').style.display = 'block';
          document.getElementById('deltaAlt').innerText = `${result.deltaAlt > 0 ? '▲ Subir' : '▼ Bajar'} ${Math.abs(result.deltaAlt).toFixed(2)}°`;
          document.getElementById('deltaAz').innerText = `${result.deltaAz > 0 ? '► Derecha' : '◄ Izquierda'} ${Math.abs(result.deltaAz).toFixed(2)}°`;
          status.innerText = `¡Resuelto! Apuntando a RA ${result.current.ra.toFixed(2)}°, Dec ${result.current.dec.toFixed(2)}°`;
        }
      }

      if (!resolved) throw new Error("Tiempo de espera agotado.");
    } catch (err) {
      status.innerText = "Error: " + err.message;
    }
  });

  function resizeImage(file, maxSide) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > h && w > maxSide) { h *= maxSide / w; w = maxSide; }
          else if (h > maxSide) { w *= maxSide / h; h = maxSide; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
